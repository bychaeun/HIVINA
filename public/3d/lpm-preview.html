<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIVINA — LPM 3D Study</title>
  <script type="module" src="./vendor/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#242923;font-family:Arial,'Malgun Gothic',sans-serif}header{height:86px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24292318}.brand{font-size:22px;font-weight:700;letter-spacing:.12em;color:#006e3c}.edition{font-size:11px;letter-spacing:.15em;color:#777d74}main{padding:34px 5vw 30px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#7b8278}h1{font-size:clamp(30px,4vw,54px);font-weight:400;letter-spacing:-.045em;margin:12px 0 4px}.hint{font-size:12px;color:#7a8076;margin:0 0 7px}model-viewer{display:block;width:100%;height:clamp(360px,60vh,720px);--progress-bar-color:#006e3c;--poster-color:transparent;background:radial-gradient(ellipse at 50% 70%,#ffffff 0%,#f4f3ef 68%)}.parts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #24292325;gap:32px;padding-top:22px}.part{display:flex;gap:16px;align-items:start}.number{font-size:11px;color:#819080;padding-top:3px}.name{font-size:15px;margin:0 0 8px;font-weight:400}.detail{font-size:11px;color:#81857d;margin:0;letter-spacing:.03em}footer{margin-top:28px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#8b9086}a{color:#006e3c;text-underline-offset:4px}@media(max-width:600px){header{height:68px}.edition{font-size:9px}.intro{display:block}.hint{margin-top:16px}.parts{gap:12px}.part{display:block}.number{display:block;margin-bottom:10px}.name{font-size:12px;line-height:1.6}.detail{font-size:9px}footer{font-size:10px}}
  </style>
  <style>
    .annotation{visibility:hidden}model-viewer[data-state="expanded"] .annotation{visibility:visible}
    @media(max-width:600px){
      .annotation--resin .callout{left:auto;right:25px;top:-47px}
      .annotation--resin .leader{left:-25px;transform:scaleX(-1)}
      .annotation--paper .callout{left:auto;right:25px;top:95px}
      .annotation--paper .leader{left:-25px;top:0;height:108px;transform:rotate(180deg)}
    }
  </style>
  <style>
    .hint button,.replay{border:0;padding:0;background:none;color:inherit;font:inherit;cursor:pointer;text-underline-offset:5px}.hint button{text-decoration:underline}.hint button:disabled{cursor:default;text-decoration:none}model-viewer{cursor:pointer}.annotation{pointer-events:none;opacity:0;transition:opacity .35s;position:relative;width:0;height:0}model-viewer[data-state="expanded"] .annotation{opacity:1}.callout{position:absolute;left:64px;top:-47px;white-space:nowrap;font-size:13px;font-weight:400;color:#3b453b;background:#f4f3efe8;padding:7px 10px}.callout small{display:block;font-size:9px;color:#7e877a;letter-spacing:.1em;margin-top:5px}.leader{position:absolute;overflow:visible;left:0;top:-35px;width:65px;height:36px}.leader path{fill:none;stroke:#737f70;stroke-width:.8}.leader circle{fill:#006e3c}.annotation--paper .callout{top:20px}.annotation--paper .leader{top:0;transform:scaleY(-1)}.annotation--core .callout{left:auto;right:65px;top:38px}.annotation--core .leader{left:-65px;top:0;transform:rotate(180deg)}.status{min-width:170px}.replay{color:#006e3c;text-decoration:underline}model-viewer:focus-visible{outline:1px solid #006e3c;outline-offset:5px}@media(max-width:600px){.callout{left:24px;font-size:10px;padding:5px}.callout small{font-size:7px}.leader{width:25px}.annotation--core .callout{right:25px}.annotation--core .leader{left:-25px}footer{flex-wrap:wrap}.status{min-width:0}}
  </style>
</head>
<body>
  <header><span class="brand">HIVINA</span><span class="edition">MATERIAL STUDY / 01</span></header>
  <main>
    <div class="intro"><div><p class="eyebrow">LPM / LAYER STRUCTURE</p><h1>Surface, in three layers.</h1></div><p class="hint"><button id="toggle" disabled>소재가 쌓이고 있습니다</button></p></div>
    <model-viewer id="assembly" src="../models/lpm-assembly.glb" alt="코어재, 나뭇결 모양지, 반투명 수지 시트. 클릭하면 구성 요소가 펼쳐집니다." camera-controls disable-pan disable-tap camera-orbit="-30deg 62deg 6.8m" camera-target="0m 0.0085m 0m" field-of-view="32deg" environment-image="neutral" exposure="1" shadow-intensity="0.55" shadow-softness="1" interaction-prompt="none" min-camera-orbit="auto 15deg 4.5m" max-camera-orbit="auto 85deg 9m" touch-action="pan-y" animation-name="Assemble" animation-crossfade-duration="0">
      <div class="annotation annotation--core" slot="hotspot-core" data-position="-1.15m 0.02m 0.85m" data-normal="0m 1m 0m"><svg class="leader" viewBox="0 0 65 36" preserveAspectRatio="none"><path d="M0 36 L35 0 H65"/><circle cx="0" cy="36" r="2"/></svg><span class="callout">MDF / PB 보드<small>CORE BOARD</small></span></div>
      <div class="annotation annotation--paper" slot="hotspot-paper" data-position="1.1m 0.35m 0.45m" data-normal="0m 1m 0m"><svg class="leader" viewBox="0 0 65 36" preserveAspectRatio="none"><path d="M0 36 L35 0 H65"/><circle cx="0" cy="36" r="2"/></svg><span class="callout">Decorative Paper<small>나뭇결 모양지</small></span></div>
      <div class="annotation annotation--resin" slot="hotspot-resin" data-position="1.1m 0.87m 0.45m" data-normal="0m 1m 0m"><svg class="leader" viewBox="0 0 65 36" preserveAspectRatio="none"><path d="M0 36 L35 0 H65"/><circle cx="0" cy="36" r="2"/></svg><span class="callout">요소/멜라민 수지 함침<small>반투명 코팅층</small></span></div>
    </model-viewer>
    <div class="parts">
      <div class="part"><span class="number">01</span><div><h2 class="name">MDF / PB 보드</h2><p class="detail">CORE BOARD</p></div></div>
      <div class="part"><span class="number">02</span><div><h2 class="name">Decorative Paper</h2><p class="detail">WOODGRAIN DECOR</p></div></div>
      <div class="part"><span class="number">03</span><div><h2 class="name">요소/멜라민 수지 함침</h2><p class="detail">TRANSLUCENT SHEET</p></div></div>
    </div>
    <footer><span class="status" id="status" aria-live="polite">모델 불러오는 중</span><button class="replay" id="replay" disabled>쌓이는 과정 다시 보기 ↻</button><a href="../models/lpm-assembly.glb" download>3D 모델 다운로드 ↗</a></footer>
  </main>
  <script type="module" src="./lpm-preview.js"></script>
</body>
</html>
